<title>Bungy System · Área privada</title>
<meta name="description" content="Bungy System private area: projects, schedule, gear, hours and invoices for clients, crew and office.">
<meta name="theme-color" content="#110d0d">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Sidebar on desktop, bottom tab bar on phone; content as lists and tables a rigger can read at a glance. */
:root {
  --bg: #f4f2f1;
  --surface: #ffffff;
  --sunk: #ebe7e6;
  --line: #ddd6d4;
  --text: #191414;
  --muted: #6b605e;
  --red: #d8231a;
  --red-soft: #fbe3e1;
  --on-red: #ffffff;
  --side: #110d0d;
  --side-text: #efe9e8;
  --side-muted: #9d918f;
  --ok: #1f7a4a; --ok-soft: #dcf1e5;
  --warn: #a35f00; --warn-soft: #fbeccf;
  --bad: #b3261e; --bad-soft: #fadcd9;
  --info: #2c5a8a; --info-soft: #dde8f4;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0b0b; --surface: #171313; --sunk: #201a1a; --line: #2f2727; --text: #f1ecea; --muted: #a49896;
  --red: #ef3a2e; --red-soft: #3a1513; --on-red: #ffffff; --side: #070606; --side-text: #efe9e8; --side-muted: #9d918f;
  --ok: #5fcf8f; --ok-soft: #123222; --warn: #f0b04a; --warn-soft: #3a2a0f; --bad: #ff7b70; --bad-soft: #3d1614; --info: #7fb2e8; --info-soft: #13253a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d0b0b; --surface: #171313; --sunk: #201a1a; --line: #2f2727; --text: #f1ecea; --muted: #a49896;
  --red: #ef3a2e; --red-soft: #3a1513; --on-red: #ffffff; --side: #070606; --side-text: #efe9e8; --side-muted: #9d918f;
  --ok: #5fcf8f; --ok-soft: #123222; --warn: #f0b04a; --warn-soft: #3a2a0f; --bad: #ff7b70; --bad-soft: #3d1614; --info: #7fb2e8; --info-soft: #13253a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Entrada */
.login { position: relative; min-height: 100%; background: var(--side); color: var(--side-text); display: flex; align-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login .in { max-width: 980px; margin: 0 auto; width: 100%; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 24px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--side-text); }
.brand svg { width: 28px; height: 28px; color: var(--red); flex: none; }
.login h1 { font: 800 clamp(40px, 6vw, 64px)/.95 var(--display); text-transform: uppercase; margin: 40px 0 12px; }
.login .sub { color: var(--side-muted); max-width: 56ch; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 34px; }
.role { text-align: left; background: #1a1414; border: 1px solid #332929; color: var(--side-text); padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, transform .2s; }
.role:hover { border-color: #ef3a2e; transform: translateY(-2px); }
.role .k { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #ef3a2e; }
.role .h { display: block; font: 800 30px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
.role .p { display: block; color: var(--side-muted); font-size: 14px; }
.role .who { margin-top: auto; padding-top: 12px; border-top: 1px dashed #332929; font: 400 12px/1.4 var(--mono); color: var(--side-muted); }
.demo-tag { display: inline-block; margin-top: 26px; font: 400 12px/1.4 var(--mono); color: var(--side-muted); border: 1px solid #332929; padding: 6px 10px; }

/* App */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-text); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.side .brand { font-size: 20px; padding: 0 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 11px 10px; color: var(--side-muted); cursor: pointer; font-weight: 500; border-left: 2px solid transparent; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { color: var(--side-text); }
.nav button[aria-current="page"] { color: var(--side-text); border-left-color: var(--red); background: #1c1515; }
.nav .badge { margin-left: auto; background: var(--red); color: var(--on-red); font: 500 11px/1 var(--mono); padding: 3px 6px; }
.side .me { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #2a2222; font-size: 13px; color: var(--side-muted); display: flex; flex-direction: column; gap: 8px; }
.side .me b { color: var(--side-text); font-weight: 600; }
.linkbtn { background: none; border: 1px solid #3a3030; color: var(--side-text); padding: 8px 10px; cursor: pointer; font-size: 13px; }
.linkbtn:hover { border-color: var(--red); }

.main { min-width: 0; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main > .in { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mtop { display: none; }
.lsw { display: inline-flex; border: 1px solid #3a3030; }
.lsw button { background: none; border: 0; color: var(--side-muted); font: 500 12px/1 var(--mono); letter-spacing: .08em; padding: 7px 9px; cursor: pointer; }
.lsw button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.login .lsw { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.mtop .lsw button { padding: 6px 7px; }
.mtop .acts { display: flex; gap: 6px; margin-top: 4px; justify-content: flex-end; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.head .k { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
.head h1 { font: 800 clamp(32px, 4.4vw, 46px)/1 var(--display); text-transform: uppercase; }
.head .note { color: var(--muted); font-size: 14px; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 14px; margin-bottom: 6px; }
.back:hover { color: var(--red); }

.card { background: var(--surface); border: 1px solid var(--line); }
.card > .ch { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card > .ch h2 { font: 700 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.card > .ch .meta { font: 400 12px/1 var(--mono); color: var(--muted); }
.card > .cb { padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.kpi { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .l { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 800 34px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 13px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); letter-spacing: .04em; padding: 5px 8px; white-space: nowrap; text-transform: uppercase; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--ok-soft); color: var(--ok); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-mute { background: var(--sunk); color: var(--muted); }

.bar { display: block; height: 6px; background: var(--sunk); position: relative; overflow: hidden; }
.row .bar { margin-top: 8px; max-width: 320px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--red); }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .grow, .row .t, .row .d { display: block; }
.row .t { font-weight: 600; }
.row .d { color: var(--muted); font-size: 13px; }
button.row { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
button.row:hover { background: var(--sunk); }
.chev { color: var(--muted); flex: none; }

.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); text-align: left; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s; }
.pcard:hover { border-color: var(--red); }
.pcard .code { font: 500 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
.pcard .h { display: block; font: 800 26px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
.pcard .d { display: block; color: var(--muted); font-size: 14px; }
.pcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ph { border-top: 3px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 3px; }
.ph.done { border-color: var(--text); }
.ph.now { border-color: var(--red); }
.ph .n { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ph.now .n { color: var(--red); }
.ph b { font-weight: 600; }
.ph .dt { font: 400 12px/1.3 var(--mono); color: var(--muted); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunk); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 9px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.btn { background: var(--red); color: var(--on-red); border: 0; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.sec { background: var(--surface); color: var(--text); border: 1px solid var(--line); }


/* Lista de carga */
.state.s-devuelto { background: var(--sunk); color: var(--text); border-color: transparent; text-decoration: line-through; }
.ldlist { display: flex; flex-direction: column; }
.ldlist .fam { display: flex; justify-content: space-between; padding: 8px 18px; background: var(--sunk); font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ldrow { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.ldrow .t { font-weight: 600; font-size: 14px; }
.ldrow .d { margin-top: 4px; }
.ldrow .q, .chk .q { min-width: 48px; text-align: right; font-size: 14px; }
.ldrow .x { background: none; border: 1px solid var(--line); color: var(--muted); width: 28px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1; }
.ldrow .x:hover { border-color: var(--bad); color: var(--bad); }
.chk { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 18px; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; color: var(--text); font: inherit; }
.chk .box { flex: none; width: 26px; height: 26px; border: 2px solid var(--muted); display: grid; place-items: center; }
.chk.on .box { background: var(--ok); border-color: var(--ok); }
.chk.on .box::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.chk .t { display: block; font-weight: 600; font-size: 16px; }
.chk.on .t { color: var(--muted); text-decoration: line-through; }
.chk .d { display: block; color: var(--bad); font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.chk:hover { background: var(--sunk); }
.ldprog { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.ldprog .cb-row { grid-template-columns: 150px minmax(0, 1fr) 56px; }
.ldprog .bar i.ok { background: var(--ok); }
.cb.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.cb.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.ldtools { display: flex; flex-direction: column; gap: 10px; }
.ldtools select, .ldtools input { padding: 9px 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; max-width: 100%; }
.ldtools select { flex: 1 1 200px; min-width: 0; }
.ldtools input { width: 72px; }
.state { border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 6px 10px; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.state.s-cargado { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.state.s-preparado { background: var(--info-soft); color: var(--info); border-color: transparent; }
.state.s-pendiente { background: var(--sunk); color: var(--muted); }

.day { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day .dd { display: flex; flex-direction: column; }
.day .dd .w { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.day .dd .n { font: 800 34px/1 var(--display); }
.day.today .dd .w, .day.today .dd .n { color: var(--red); }
.slot { display: flex; flex-direction: column; gap: 4px; }
.slot + .slot { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.slot .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.slot .time { font: 500 14px/1 var(--mono); }
.slot .place { color: var(--muted); font-size: 14px; }

.plan { border-collapse: separate; border-spacing: 0; min-width: 760px; }
.plan th, .plan td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.plan td { padding: 8px; height: 64px; vertical-align: top; width: 13%; }
.plan td.who { width: 150px; font-weight: 600; background: var(--surface); position: sticky; left: 0; z-index: 1; }
.plan td.who span { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.plan th.today { color: var(--red); }
.chip { display: block; padding: 6px 8px; font-size: 12px; line-height: 1.3; border-left: 3px solid var(--c, var(--muted)); background: var(--sunk); }
.chip b { display: block; font: 500 11px/1.2 var(--mono); }

.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert .grow { flex: 1; min-width: 0; }
.alert .d { color: var(--muted); font-size: 13px; }

.catbars { display: flex; flex-direction: column; gap: 12px; }
.cb-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 14px; }
.cb-row .bar { height: 10px; }
.cb-row .num { text-align: right; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 12px 16px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }

.tabbar { display: none; }
.hbox { display: flex; flex-direction: column; gap: 8px; }
.hbox .hhead { display: flex; align-items: center; gap: 10px; }
.hbox .d { color: var(--muted); font-size: 13px; }
.hform { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.hform label { display: flex; flex-direction: column; gap: 4px; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hform input { font: 400 15px/1.2 var(--mono); padding: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 110px; }
.hform input[type="number"] { width: 90px; }
.hbtns { display: flex; gap: 8px; }
tr.editing td { background: var(--sunk); }
.hacts { white-space: nowrap; }
@media (max-width: 860px) { .hacts { white-space: normal; padding-left: 4px; } .htable td, .htable th { padding-left: 6px; padding-right: 6px; } .htable .pill { font-size: 10px; padding: 4px 6px; } .hacts .pdfbtn { display: block; width: 100%; margin: 3px 0; padding: 7px 5px; } }
.pdfbtn.ok { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.cal-h { background: var(--surface); text-align: center; font: 500 11px/1 var(--mono); color: var(--muted); padding: 10px 0; }
.cal-c { background: var(--surface); border: 0; min-height: 84px; padding: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer; min-width: 0; }
.cal-c.empty { background: var(--sunk); cursor: default; }
.cal-c:hover { background: var(--sunk); }
.cal-c .dn { font: 700 15px/1 var(--body); font-variant-numeric: tabular-nums; }
.cal-c.today .dn { background: var(--red); color: var(--on-red); padding: 3px 5px; margin: -3px -5px; }
.cal-c.sel { box-shadow: inset 0 0 0 2px var(--red); }
.cal-c .lbl { font-size: 11px; line-height: 1.2; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.cal-c .dots { display: flex; gap: 3px; margin-top: auto; }
.cal-c .dots i, .cal-key i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cal-key { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.cal-key span { display: inline-flex; align-items: center; gap: 6px; }
.calnav { background: none; border: 1px solid var(--line); width: 36px; height: 36px; cursor: pointer; font-size: 18px; color: var(--text); }
.calnav:hover { border-color: var(--red); color: var(--red); }
.linkish { background: none; border: 0; padding: 4px 0 0; color: var(--red); cursor: pointer; font-weight: 600; font-size: 13px; }
.pdfbtn { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 500 11px/1 var(--mono); padding: 7px 9px; cursor: pointer; white-space: nowrap; }
.pdfbtn:hover { border-color: var(--red); color: var(--red); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
tfoot td { border-bottom: 0; padding-block: 8px; }
tfoot tr:first-child td { border-top: 1px solid var(--line); padding-top: 14px; }
tfoot .sumlbl { color: var(--muted); text-align: right; }
tfoot .tot td { font-weight: 700; font-size: 16px; padding-bottom: 14px; }
tfoot .tot .sumlbl { color: var(--text); }
.nowrap { white-space: nowrap; }
.mute { color: var(--muted); }

      return '<tr><td>' + it.name + '</td><td class="hide-m">' + it.cat + '</td><td class="r num hide-m">' + it.total + '</td><td class="r num">' + s.inNave + '</td><td class="r num">' + s.out + '</td><td class="r num">' + (s.need || '·') + '</td>' + (compact ? '' : '<td class="hide-m num">' + fdate(it.rev) + '</td>') + '<td>' + s.pill + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="mute">No hay equipo que coincida con la búsqueda.</td></tr>') +
    '</tbody></table></div></div>';
}
function eMaterial() {
  const nx = AGENDA.filter(a => a[1] === S.user && a[2] && a[0] >= TODAY && /Carga del cami/.test(a[5])).sort()[0];
  let next = '';
  if (nx) { const p = PROJECTS[nx[2]], tot = p.needs.reduce((a, l) => a + l[1], 0), ready = p.needs.filter(l => l[2] !== 'pendiente').reduce((a, l) => a + l[1], 0);
    next = '<div class="card"><div class="ch"><h2>Próxima carga</h2><span class="meta">' + fdate(nx[0]) + ' · ' + nx[4] + '</span></div><div class="cb tools"><div class="grow"><div class="t">' + esc(p.title) + '</div><div class="d">' + ready + ' uds preparadas o cargadas de ' + tot + '</div></div><button class="btn" data-ldopen="' + nx[2] + '">Abrir lista de carga</button></div></div>'; }
  return head('Almacén', 'Material', '"Se necesita" es lo reservado para trabajos que aún no ha salido') + next + warehouseTable(true);
}

// Administración
function adminMoney(id) {
  const p = PROJECTS[id], spent = EXPENSES.filter(e => e[3] === id).reduce((a, e) => a + e[4], 0), billed = INVOICES.filter(i => i[2] === id).reduce((a, i) => a + i[4], 0);
  return '<div class="card"><div class="ch"><h2>Números</h2></div><div class="list">' +
    '<div class="row"><div class="grow d">Presupuesto</div><span class="num">' + eur(p.budget) + '</span></div>' +
    '<div class="row"><div class="grow d">Facturado</div><span class="num">' + eur(billed) + '</span></div>' +
    '<div class="row"><div class="grow d">Gastos imputados</div><span class="num">' + eur(spent) + '</span></div></div></div>';
}
function aResumen() {
  const act = active(), al = alerts();
  const outUnits = Object.keys(ITEMS).reduce((a, id) => a + stock(id).out, 0);
  const pend = INVOICES.filter(i => i[7] !== 'pagada').reduce((a, i) => a + i[4], 0);
  const monthExp = EXPENSES.filter(e => e[0].startsWith('2026-10')).reduce((a, e) => a + e[4], 0);
  const todayList = AGENDA.filter(a => a[0] === TODAY);
  return head('Viernes, 23 de octubre', 'Resumen', 'Datos de ejemplo') +
    '<div class="kpis"><div class="kpi"><span class="l">Proyectos activos</span><span class="v">' + act.length + '</span><span class="s">' + act.filter(([, p]) => p.phase === 3).length + ' en rodaje</span></div>' +
    '<div class="kpi"><span class="l">Material fuera</span><span class="v">' + outUnits + '</span><span class="s">unidades en trabajos</span></div>' +
    '<div class="kpi"><span class="l">Pendiente de cobro</span><span class="v">' + eur(pend) + '</span><span class="s">' + INVOICES.filter(i => i[7] === 'vencida').length + ' factura vencida</span></div>' +
    '<div class="kpi"><span class="l">Gastos de octubre</span><span class="v">' + eur(monthExp) + '</span><span class="s">' + EXPENSES.length + ' apuntes</span></div></div>' +
    '<div class="grid2"><div class="card"><div class="ch"><h2>Avisos</h2><span class="meta">' + al.length + '</span></div><div>' +
    al.map(a => '<div class="alert"><span class="pill ' + a[0] + '">' + a[1] + '</span><div class="grow"><div class="t">' + esc(a[2]) + '</div><div class="d">' + a[3] + '</div></div></div>').join('') + '</div></div>' +
    '<div class="card"><div class="ch"><h2>Hoy, quién está dónde</h2></div><div class="list">' +
    todayList.map(a => '<div class="row"><div class="grow"><div class="t">' + EMPLOYEES[a[1]].name + '</div><div class="d">' + esc(a[3]) + ' · ' + a[4] + '</div></div>' + (a[2] ? '<span class="pill p-info">' + PROJECTS[a[2]].title + '</span>' : '<span class="pill p-mute">Nave</span>') + '</div>').join('') + '</div></div></div>' +
    '<div class="card"><div class="ch"><h2>Proyectos activos</h2></div><div class="list">' + act.map(([id, p]) => projRow(id, p)).join('') + '</div></div>';
}
function projRow(id, p) {
  const pr = progress(p);
  return '<button class="row" data-proj="' + id + '"><span class="grow"><span class="t">' + esc(p.title) + ' <span class="d mono">' + p.code + '</span></span><span class="d">' + CLIENTS[p.client].name + ' · ' + p.type + '</span><span class="bar"><i style="width:' + pr + '%"></i></span></span>' + statusPill(p) + '<span class="chev">›</span></button>';
}
function aProyectos() {
  if (S.detail) return eDetalle(S.detail);
  const f = S.clientFilter, cids = Object.keys(CLIENTS).filter(c => f === 'todos' || c === f);
  return head('Por cliente', 'Proyectos', Object.keys(PROJECTS).length + ' proyectos') +
    '<div class="tools"><div class="seg" role="group" aria-label="Cliente"><button data-cf="todos" aria-pressed="' + (f === 'todos') + '">Todos</button>' + Object.entries(CLIENTS).map(([c, x]) => '<button data-cf="' + c + '" aria-pressed="' + (f === c) + '">' + esc(x.name) + '</button>').join('') + '</div></div>' +
    cids.map(c => { const ps = Object.entries(PROJECTS).filter(([, p]) => p.client === c);
      return '<div class="card"><div class="ch"><h2>' + esc(CLIENTS[c].name) + '</h2><span class="meta">' + ps.length + (ps.length === 1 ? ' proyecto' : ' proyectos') + '</span></div><div class="list">' + ps.map(([id, p]) => projRow(id, p)).join('') + '</div></div>'; }).join('');
}
function aPlan() {
  const dates = [...new Set(AGENDA.map(a => a[0]))].sort().slice(0, 7);
  return head('Equipo', 'Planificación', 'Quién está dónde cada día') +
    '<div class="card"><div class="tablewrap"><table class="plan"><thead><tr><th>Persona</th>' + dates.map(dt => '<th class="' + (dt === TODAY ? 'today' : '') + '">' + d(dt).toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric' }) + '</th>').join('') + '</tr></thead><tbody>' +
    Object.entries(EMPLOYEES).map(([eid, e]) => '<tr><td class="who">' + e.name + '<span>' + e.role + '</span></td>' + dates.map(dt => { const a = AGENDA.find(x => x[0] === dt && x[1] === eid);
      if (!a) return '<td></td>';
      const pc = (a[2] && PCOLOR[a[2]]) || 'var(--muted)';
      return '<td><span class="chip" style="--c:' + pc + '"><b>' + (a[2] ? PROJECTS[a[2]].title : 'Nave') + '</b>' + a[4] + ' · ' + esc(a[3].split(',')[0].split(' · ')[0]) + '</span></td>'; }).join('') + '</tr>').join('') +
    '</tbody></table></div></div>' +
    '<div class="card"><div class="ch"><h2>Agenda detallada</h2></div>' + agendaFor(null, 8) + '</div>';
}
function aAlmacen() {
  const al = Object.keys(ITEMS).filter(id => stock(id).level > 0).length;
  const loads = active().map(([id, p]) => { const tot = p.needs.reduce((a, l) => a + l[1], 0), loaded = p.needs.filter(l => l[2] === 'cargado' || l[2] === 'devuelto').reduce((a, l) => a + l[1], 0), pend = p.needs.filter(l => l[2] === 'pendiente').length;
    return '<div class="row"><div class="grow"><div class="t">' + esc(p.title) + ' <span class="mute">· ' + p.code + '</span></div><div class="d">' + esc(p.place.split(',')[0]) + ' · ' + PHASES[p.phase] + (tot ? ' · Cargado ' + loaded + ' de ' + tot : ' · Sin material todavía') + (pend ? ' · ' + pend + ' líneas pendientes' : '') + '</div></div><button class="btn sec" data-ldopen="' + id + '" data-ldmode0="lista">Lista de carga</button></div>'; }).join('');
  return head('Inventario', 'Almacén', al + ' equipos con aviso') +
    '<div class="card"><div class="ch"><h2>Listas de carga</h2><span class="meta">Un trabajo, una lista: lo que no está en ella no sale de la nave</span></div><div class="list">' + loads + '</div></div>' + warehouseTable(false) +
    '<div class="tools"><button class="btn" data-demo="Añadir equipo">Añadir equipo</button><button class="btn sec" data-demo="Registrar entrada o salida">Registrar entrada o salida</button></div>';
}
function aFacturas() {
  const f = S.invFilter, rows = INVOICES.filter(i => f === 'todas' || i[7] === f);
  const sum = s => INVOICES.filter(i => i[7] === s).reduce((a, i) => a + i[4], 0);
  return head('Facturación', 'Facturas', '') +
    '<div class="kpis k3"><div class="kpi"><span class="l">Cobrado</span><span class="v">' + eur(sum('pagada')) + '</span></div><div class="kpi"><span class="l">Pendiente</span><span class="v">' + eur(sum('pendiente')) + '</span></div><div class="kpi"><span class="l">Vencido</span><span class="v bad">' + eur(sum('vencida')) + '</span></div></div>' +
    '<div class="tools"><div class="seg" role="group" aria-label="Estado">' + ['todas', 'pendiente', 'vencida', 'pagada'].map(s => '<button data-inv="' + s + '" aria-pressed="' + (f === s) + '">' + s[0].toUpperCase() + s.slice(1) + '</button>').join('') + '</div><button class="btn" data-demo="Nueva factura">Nueva factura</button></div>' +
    '<div class="card">' + invoicesTable(rows, true) + '</div>';
}
function aGastos() {
  const tot = EXPENSES.reduce((a, e) => a + e[4], 0), byCat = {};
  EXPENSES.forEach(e => byCat[e[2]] = (byCat[e[2]] || 0) + e[4]);
  const max = Math.max(...Object.values(byCat));
  return head('Octubre de 2026', 'Gastos', 'Total ' + eur(tot)) +
    '<div class="grid3"><div class="card"><div class="ch"><h2>Apuntes</h2><button class="btn" data-demo="Añadir gasto">Añadir gasto</button></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="hide-m">Proyecto</th><th class="r">Importe</th></tr></thead><tbody>' +
    EXPENSES.slice().reverse().map(e => '<tr><td class="num">' + fdate(e[0]) + '</td><td>' + esc(e[1]) + '<div class="sub12">' + e[2] + '</div></td><td class="hide-m">' + (e[3] ? PROJECTS[e[3]].title : '<span class="mute">General</span>') + '</td><td class="r num">' + eur(e[4]) + '</td></tr>').join('') +
    '</tbody></table></div></div><div class="card"><div class="ch"><h2>Por categoría</h2></div><div class="cb catbars">' +
    Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => '<div class="cb-row"><span>' + c + '</span><div class="bar"><i style="width:' + (v / max * 100) + '%"></i></div><span class="num">' + eur(v) + '</span></div>').join('') + '</div></div></div>';
}
function aPersonas() {
  return head('Directorio', 'Personas', 'Cada persona entra con su propio usuario') +
    '<div class="grid2"><div class="card"><div class="ch"><h2>Clientes</h2><button class="btn sec" data-demo="Invitar cliente">Invitar</button></div><div class="list">' +
    Object.entries(CLIENTS).map(([cid, c]) => { const n = Object.values(PROJECTS).filter(p => p.client === cid).length; return '<button class="row" data-client="' + cid + '"><span class="grow"><span class="t">' + c.name + '</span><span class="d">' + c.contact + ' · ' + c.country + '</span></span><span class="pill p-info">' + n + (n === 1 ? ' proyecto' : ' proyectos') + '</span><span class="chev">›</span></button>'; }).join('') + '</div></div>' +
    '<div class="card"><div class="ch"><h2 data-en="Crew">Equipo</h2><button class="btn sec" data-demo="Añadir empleado">Añadir</button></div><div class="list">' +
    Object.entries(EMPLOYEES).map(([, e]) => '<div class="row"><div class="grow"><div class="t">' + e.name + '</div><div class="d">' + e.role + '</div></div><span class="pill p-mute">Empleado</span></div>').join('') +
    '<div class="row"><div class="grow"><div class="t">Carmen López</div><div class="d">Administración</div></div><span class="pill p-ok">Admin</span></div></div></div></div>';
}

const VIEWS = {
  cliente: { proyectos: cProyectos, facturas: cFacturas },
  empleado: { agenda: eAgenda, trabajos: eTrabajos, material: eMaterial, horas: eHoras },
  admin: { resumen: aResumen, proyectos: aProyectos, plan: aPlan, horas: aHoras, almacen: aAlmacen, facturas: aFacturas, gastos: aGastos, personas: aPersonas }
};

function render(keepFocus) {
  const root = $('#root');
  document.documentElement.lang = LANG;
  if (!S.role) { root.innerHTML = viewLogin(); translateDom(root); return; }
  const focusId = document.activeElement && document.activeElement.id;
  root.innerHTML = shell(VIEWS[S.role][S.tab]()); translateDom(root);
  if (keepFocus && focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); el.setSelectionRange && el.setSelectionRange(el.value.length, el.value.length); } }
}
function go(tab, detail) { S.tab = tab; S.detail = detail || null; S.loadMode = 'lista'; render(); scrollTo(0, 0); showTab(); }
const showTab = () => { const b = document.querySelector('.tabbar button[aria-current="page"]'); if (b) b.scrollIntoView({ block: 'nearest', inline: 'center' }); };

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.setlang) { setLang(t.dataset.setlang); return; }
  if (t.dataset.role) { S.role = t.dataset.role; S.user = ROLES[S.role].user; go(ROLES[S.role].tabs[0][0]); return; }
  if (t.hasAttribute('data-logout')) { S.role = null; S.detail = null; S.hEdit = null; render(); scrollTo(0, 0); return; }
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.hasAttribute('data-back')) { go(S.tab); return; }
  if (t.dataset.proj) { const tab = S.role === 'admin' ? 'proyectos' : S.role === 'empleado' ? 'trabajos' : 'proyectos'; go(tab, t.dataset.proj); return; }
  if (t.dataset.need) { const [pid, k] = t.dataset.need.split(':'), n = PROJECTS[pid].needs[+k], order = ['pendiente', 'preparado', 'cargado', 'devuelto'];
    n[2] = order[(order.indexOf(n[2]) + 1) % 4]; render(); toast(ITEMS[n[0]].name + ': ' + n[2]); return; }
  if (t.dataset.ldmode) { S.loadMode = t.dataset.ldmode; render(); return; }
  if (t.dataset.ldopen) { go(S.role === 'admin' ? 'proyectos' : 'trabajos', t.dataset.ldopen); S.loadMode = t.dataset.ldmode0 || 'carga'; render(); return; }
  if (t.dataset.load) { const [pid, k] = t.dataset.load.split(':'), n = PROJECTS[pid].needs[+k];
    if (S.loadMode === 'carga') n[2] = (n[2] === 'cargado' || n[2] === 'devuelto') ? 'preparado' : 'cargado'; else n[2] = n[2] === 'devuelto' ? 'cargado' : 'devuelto';
    render(); return; }
  if (t.dataset.ldrm) { const [pid, k] = t.dataset.ldrm.split(':'), n = PROJECTS[pid].needs[+k]; if (n[2] !== 'pendiente') { toast('Solo se pueden quitar líneas pendientes.'); return; } PROJECTS[pid].needs.splice(+k, 1); render(); toast('Línea quitada.'); return; }
  if (t.dataset.ldadd) { const pid = t.dataset.ldadd, it = document.getElementById('ld-item').value, q = Math.max(1, +document.getElementById('ld-qty').value || 1), n = PROJECTS[pid].needs;
    const ex = n.find(l => l[0] === it && l[2] === 'pendiente'); if (ex) ex[1] += q; else n.push([it, q, 'pendiente']); render(); toast('Añadido a la lista.'); return; }
  if (t.dataset.ldtpl) { const pid = t.dataset.ldtpl, name = document.getElementById('ld-tpl').value, n = PROJECTS[pid].needs; let added = 0;
    TEMPLATES[name].forEach(([it, q]) => { if (!n.some(l => l[0] === it)) { n.push([it, q, 'pendiente']); added++; } });
    render(); toast(added ? added + ' líneas añadidas desde la plantilla "' + name + '".' : 'La lista ya tiene todo lo de la plantilla.'); return; }
  if (t.dataset.cat) { S.whCat = t.dataset.cat; render(); return; }
  if (t.dataset.hsave) { const key = t.dataset.hsave, id = key.replace('|', '-'), v = k => document.getElementById('h-' + k + '-' + id).value;
    const h = { in: v('in'), out: v('out'), brk: Math.max(0, +v('brk') || 0) };
    if (!h.in || !h.out || mins(h.out) <= mins(h.in)) { toast('Revisa las horas: la salida tiene que ser posterior a la entrada.'); return; }
    const prev = HOURS[key] || {}, [e, dt] = key.split('|');
    HOURS[key] = Object.assign({ proj: projOf(e, dt) }, prev, h, t.dataset.admin ? { st: 'validada', by: 'Carmen López' } : { st: 'pendiente', by: '' });
    S.hEdit = null; render(); toast(t.dataset.admin ? 'Horas corregidas y validadas.' : 'Horas guardadas. Dirección las validará.'); return; }
  if (t.dataset.hedit) { S.hEdit = t.dataset.hedit; render(); return; }
  if (t.hasAttribute('data-hcancel')) { S.hEdit = null; render(); return; }
  if (t.dataset.hval) { Object.assign(HOURS[t.dataset.hval], { st: 'validada', by: 'Carmen López' }); render(); toast('Horas validadas.'); return; }
  if (t.hasAttribute('data-hvalall')) { Object.values(HOURS).forEach(h => { if (h.st === 'pendiente') Object.assign(h, { st: 'validada', by: 'Carmen López' }); }); render(); toast('Todas las horas pendientes están validadas.'); return; }
  if (t.dataset.hemp) { S.hEmp = t.dataset.hemp; S.hEdit = null; render(); return; }
  if (t.dataset.agv) { S.agView = t.dataset.agv; render(); return; }
  if (t.dataset.day) { S.calDay = t.dataset.day; render(); if (matchMedia('(max-width: 860px)').matches) document.getElementById('day-detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.mon) { const [y, m] = S.calMonth.split('-').map(Number), nd = new Date(y, m - 1 + (+t.dataset.mon), 1, 12); S.calMonth = nd.getFullYear() + '-' + String(nd.getMonth() + 1).padStart(2, '0'); render(); return; }
  if (t.dataset.cf) { S.clientFilter = t.dataset.cf; render(); return; }
  if (t.dataset.client) { S.clientFilter = t.dataset.client; go('proyectos'); return; }
  if (t.dataset.inv) { S.invFilter = t.dataset.inv; render(); return; }
  if (t.dataset.pdf) { if (!window.jspdf) { toast('No se ha podido preparar el PDF. Comprueba la conexión.'); return; } saveFile('Bungy-System-' + t.dataset.pdf + '.pdf', invoicePdf(t.dataset.pdf)); return; }
  if (t.hasAttribute('data-doc')) { toast('En la demo los documentos no se abren.'); return; }
  if (t.dataset.demo) { toast(t.dataset.demo + ': en la demo no se guarda nada.'); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'wh-q') { S.whQ = e.target.value; render(true); } });

document.title = LANG === 'en' ? 'Bungy System · Private area' : 'Bungy System · Área privada';
render(); showTab();
})();
</script>
